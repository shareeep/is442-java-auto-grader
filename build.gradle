buildscript {
    configurations.classpath {
        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            // CVE-2025-4949: eclipse.jgit XXE Vulnerability (fixed in 7.2.1)
            if (details.requested.group == 'org.eclipse.jgit') {
                details.useVersion '7.6.0.202603022253-r'
            }
        }
    }
}

plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '7.0.2'
    id 'org.springframework.boot' version '3.5.12'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.is442'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

application {
    mainClass = 'com.is442.autograder.App'
}

repositories {
    mavenCentral()
}

configurations.all {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        // CVE-2025-48734: commons-beanutils Improper Access Control (fixed in 1.11.0)
        if (details.requested.group == 'commons-beanutils' && details.requested.name == 'commons-beanutils') {
            details.useVersion '1.11.0'
        }
        // CVE-2025-67030: plexus-utils Directory Traversal (fixed in 4.0.3, no patched 3.x)
        if (details.requested.group == 'org.codehaus.plexus' && details.requested.name == 'plexus-utils') {
            details.useVersion '4.0.3'
        }
        // CVE-2025-48924: commons-lang3 Uncontrolled Recursion (fixed in 3.18.0)
        if (details.requested.group == 'org.apache.commons' && details.requested.name == 'commons-lang3') {
            details.useVersion '3.20.0'
        }
        // GHSA-72hv-8253-57qq: jackson-core Async Parser DoS (fixed in 2.21.1)
        // Only jackson-core needs the patch; jackson-databind and jackson-annotations
        // must stay at Spring Boot's managed version to avoid class-not-found errors.
        if (details.requested.group == 'com.fasterxml.jackson.core' &&
                details.requested.name == 'jackson-core') {
            details.useVersion '2.21.1'
        }
    }
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.12')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.jfree:jfreechart:1.5.4'
    implementation 'com.github.librepdf:openpdf:1.3.42'
    implementation 'com.googlecode.lanterna:lanterna:3.1.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.apache.pdfbox:pdfbox:3.0.3'
    implementation 'ai.docling:docling-serve-client:0.5.0'
    implementation 'org.xerial:sqlite-jdbc:3.45.1.0'
    implementation 'dev.langchain4j:langchain4j-open-ai-spring-boot-starter:1.12.2-beta22'
    implementation 'dev.langchain4j:langchain4j-spring-boot-starter:1.12.2-beta22'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    
    // JPlag plagiarism detection
    implementation 'de.jplag:jplag:6.3.0'
    implementation 'de.jplag:java:6.3.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Disable the default Spring Boot jar task so it doesn't conflict
tasks.named('bootJar') {
    archiveClassifier = 'web'
    mainClass = 'com.is442.autograder.web.WebApplication'
    if (!project.hasProperty('skipFrontend')) {
        dependsOn 'copyFrontend'
    }
}

// bootRun should launch the web UI (Spring Boot), not the console
tasks.named('bootRun') {
    mainClass = 'com.is442.autograder.web.WebApplication'
}

// Keep the standard jar enabled for console mode
tasks.named('jar') {
    enabled = true
}

// Build a fat/uber JAR so the app can be run as a single JAR
tasks.register('fatJar', Jar) {
    archiveClassifier = 'all'
    from sourceSets.main.output
    manifest {
        attributes 'Main-Class': application.mainClass
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

// Build frontend (requires npm installed)
tasks.register('buildFrontend', Exec) {
    onlyIf { !project.hasProperty('skipFrontend') }
    workingDir 'frontend'
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'npm', 'run', 'build'
    } else {
        commandLine 'npm', 'run', 'build'
    }
}

// Copy built frontend into Spring Boot static resources
tasks.register('copyFrontend', Copy) {
    onlyIf { !project.hasProperty('skipFrontend') && file('frontend/dist').exists() }
    dependsOn 'buildFrontend'
    from 'frontend/dist'
    into 'src/main/resources/static'
}

// Ensure processResources runs after copyFrontend when both are in the task graph
tasks.named('processResources') {
    mustRunAfter 'copyFrontend'
}

// Checkstyle — Google Java Style (warns only, doesn't fail the build)
checkstyle {
    toolVersion = '10.12.5'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
    ignoreFailures = true
    maxWarnings = 0
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = false
        html.required = true
    }
}

// Spotless — auto-format + cleanup (Eclipse JDT, JDK-independent)
spotless {
    java {
        eclipse('4.33')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
		options.release = 25
}

// Make 'build' also produce the fat JAR and install Git hooks
tasks.named('build') {
    dependsOn 'fatJar', 'installGitHook'
}

// Install Git pre-push hook for lint checks
tasks.register('installGitHook', Copy) {
    description = 'Installs the pre-push Git hook for lint checks'
    group = 'setup'
    from "${rootDir}/config/git-hooks/pre-push"
    into "${rootDir}/.git/hooks"
    filePermissions {
        user {
            read = true
            write = true
            execute = true
        }
        group {
            read = true
            execute = true
        }
        other {
            read = true
            execute = true
        }
    }
}
