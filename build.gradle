plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '7.0.2'
}

group = 'com.is442'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'com.is442.autograder.App'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.4.1')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.jfree:jfreechart:1.5.4'
    implementation 'com.github.librepdf:openpdf:1.3.42'
    implementation 'com.googlecode.lanterna:lanterna:3.1.2'
}

tasks.named('test') {
    useJUnitPlatform()
}


// Build a fat/uber JAR so the app can be run as a single JAR
tasks.register('fatJar', Jar) {
    archiveClassifier = 'all'
    from sourceSets.main.output
    manifest {
        attributes 'Main-Class': application.mainClass
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

// Checkstyle — Google Java Style (warns only, doesn't fail the build)
checkstyle {
    toolVersion = '10.12.5'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
    ignoreFailures = true
    maxWarnings = 0
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = false
        html.required = true
    }
}

// Spotless — auto-format + cleanup (Eclipse JDT, JDK-independent)
spotless {
    java {
        eclipse('4.33')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// Make 'build' also produce the fat JAR and install Git hooks
tasks.named('build') {
    dependsOn 'fatJar', 'installGitHook'
}

// Install Git pre-push hook for lint checks
tasks.register('installGitHook', Copy) {
    description = 'Installs the pre-push Git hook for lint checks'
    group = 'setup'
    from "${rootDir}/config/git-hooks/pre-push"
    into "${rootDir}/.git/hooks"
    filePermissions {
        user {
            read = true
            write = true
            execute = true
        }
        group {
            read = true
            execute = true
        }
        other {
            read = true
            execute = true
        }
    }
}