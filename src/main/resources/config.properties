# ============================================================
# IS442 Auto Grading System - Configuration
# ============================================================
# External ./config.properties takes priority over this file.
# Question config is inferred from tester files at runtime.
# ============================================================

# Execution Settings
execution.timeout.seconds=10

# Question Configuration (inferred from tester files at runtime)
questions.list=
questions.folders=
questions.testers=
questions.max.scores=
questions.dependency.folders=
questions.dependency.files=

# Template folder name inside the project-materials directory that holds
# pre-compiled dependency class files copied before grading.
assessment.template.folder=RenameToYourUsername

# Validation Settings
validation.strict.mode=false
validation.allow.extra.files=true

# Output Settings
output.include.anomalies=true

# Report Settings
assessment.name=IS442 – Exam

# System Integrations
docling.serve.url=http://localhost:5001

# AI Test Generation (via OpenRouter — set OPENROUTER_API_KEY env var)
ai.model=minimax/minimax-m2.7
ai.default.cases.per.question=3
