# ============================================================
# IS442 Auto Grading System - Configuration
# ============================================================

# Execution Settings
execution.timeout.seconds=10

# Question Configuration
# Each index corresponds across all lists (comma-separated, one entry per question):
#   questions.list              = question identifier
#   questions.folders           = which subfolder the student question lives in
#   questions.testers           = tester class name (no .java extension)
#   questions.max.scores        = maximum score for that question
#   questions.dependency.folders = sub-folder inside the template directory that holds
#                                  pre-compiled dependency files (empty = no dependencies)
#   questions.dependency.files  = semicolon-separated list of files to copy from the
#                                  dependency folder into the student question folder
#                                  before compilation (empty = no files to copy)
questions.list=Q1a,Q1b,Q2a,Q2b,Q3
questions.folders=Q1,Q1,Q2,Q2,Q3
questions.testers=Q1aTester,Q1bTester,Q2aTester,Q2bTester,Q3Tester
questions.max.scores=3.0,3,5,5,4
questions.dependency.folders=,,Q2,Q2,Q3
questions.dependency.files=,,DataException.class;persons.txt;students.txt,DataException.class;persons.txt;students.txt,Shape.class;Circle.class;Rectangle.class

# Template folder name inside the project-materials directory that holds
# pre-compiled dependency class files copied before grading.
assessment.template.folder=RenameToYourUsername

# Validation Settings
validation.strict.mode=false
validation.allow.extra.files=true

# Output Settings
output.include.anomalies=true

# Report Settings
# The assessment name shown in the instructor report header
assessment.name=IS442 – Exam

# AI Test Generation (via OpenRouter — set OPENROUTER_API_KEY env var)
ai.model=qwen/qwen3.5-397b-a17b
ai.max.tokens=99999
ai.default.cases.per.question=3
