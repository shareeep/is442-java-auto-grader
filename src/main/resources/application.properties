# Spring Boot configuration for web mode
server.port=8080
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.mvc.async.request-timeout=600000
server.tomcat.connection-timeout=600s

# Logging
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{30} - %msg%n
logging.level.root=WARN
logging.level.com.is442.autograder=INFO
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.web=WARN
logging.level.langchain4j=DEBUG

# LangChain4j — OpenRouter (OpenAI-compatible)
# Vision model: used when exam question contains embedded images
langchain4j.open-ai.chat-model.api-key=${OPENROUTER_API_KEY}
langchain4j.open-ai.chat-model.model-name=xiaomi/mimo-v2-omni
langchain4j.open-ai.chat-model.base-url=https://openrouter.ai/api/v1
langchain4j.open-ai.chat-model.max-tokens=16384
langchain4j.open-ai.chat-model.timeout=180s
langchain4j.open-ai.chat-model.log-requests=true
langchain4j.open-ai.chat-model.log-responses=true
# Text-only model: used when exam question has no images
ai.text-model=minimax/minimax-m2.7
